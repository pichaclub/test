<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        html ,body{
            height: 2000px;
        }
        .blue{
            background-color: blue;
            width: 200px;
            height: 200px;
              /* position: relative;
            top:200px; */
        }
          .green{
            background-color:green;
            width: 300px;
            height: 200px;
           
            position: fixed;
            top:150px;
            left:150px;
            z-index:0;
           
           

        }
           .red{
            background-color:red;
            width: 100px;
            height: 200px;
            /* position: sticky;
            top:50px; */
            
        }
           .yellow{
            background-color:yellow;
            width: 200px;
            height: 300px;
            position: absolute;
            z-index: 2;
          
           
        }
    </style>
</head>
<body>
    <div class="blue"></div>
    <div class="green"></div>
    <div class="red"></div>
    <div class="yellow"></div>

    
</body>
</html>
