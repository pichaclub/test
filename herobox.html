<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>herobox</title>
    <style>
        html , body{
            margin: 0;
            height: 100%;
         
        }
        .heroImage{
            background-image: linear-gradient(rgba(122, 8, 13, 0.466),rgba(115, 120, 14, 0.474)), url('4.png');
            height: 90%;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
           

        }
        .heroText{
            text-align: center;
            color: aliceblue;
            font-size: 20px;
            position: absolute;
            top:30%;
            left:50%;
            transform: translate(-50%,-50%);
        }
        .heroText h1{
            font-size: 40px;
        }
        .heroText button{
            background-color: blueviolet;
            border-radius: 4px;
            color: aliceblue;
            padding: 15px 24px;
            border: none;
        }

     
    </style>
</head>
<body>
    <div class="heroImage">
        <div class="heroText">
            <h1>salam</h1>
            <p>salam salam</p>
            <button> click me </button>
        </div>
    </div>
    
</body>
</html>
